name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          mkdir -p build/android ~/.config/godot ~/.local/share/godot/export_templates/4.3.stable
          T=$(find / -name android_debug.apk -not -path '/proc/*' 2>/dev/null | head -1)
          cp -r "$(dirname "$T")"/. ~/.local/share/godot/export_templates/4.3.stable/ || true
          JAVA=$(dirname $(dirname $(readlink -f $(which javac))))
          SM=$(find /usr/lib/android-sdk -name sdkmanager | head -1)
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "build-tools;34.0.0" "platforms;android-34" || true
          cat > ~/.config/godot/editor_settings-4.3.tres <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
          godot --headless --import || true
      - name: Exportar
        shell: bash
        run: |
          rm -f build/android/espacio.apk
          intento() { godot --headless --export-debug "Android" build/android/espacio.apk > /tmp/o.txt 2>&1; [ -f build/android/espacio.apk ]; }
          echo "RESULT probando 1 preset actual"
          if intento; then echo "RESULT GANA 1 preset actual"; exit 0; fi
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          echo "RESULT probando 2 variables de keystore"
          if intento; then echo "RESULT GANA 2 variables de keystore"; exit 0; fi
          cp export_presets_full.cfg export_presets.cfg
          echo "RESULT probando 3 preset completo mas variables"
          if intento; then echo "RESULT GANA 3 preset completo mas variables"; exit 0; fi
          echo "RESULT NINGUNA FUNCIONO"
          tail -n 40 /tmp/o.txt
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: espacio-apk
          path: build/android/espacio.apk
