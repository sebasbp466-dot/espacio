name: build-apk
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          mkdir -p build/android ~/.local/share/godot/export_templates/4.3.stable
          T=$(find / -name android_debug.apk -not -path '/proc/*' 2>/dev/null | head -1)
          cp -r "$(dirname "$T")"/. ~/.local/share/godot/export_templates/4.3.stable/ || true
          JAVA=$(dirname $(dirname $(readlink -f $(which javac))))
          SM=$(find /usr/lib/android-sdk -name sdkmanager | head -1)
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "build-tools;34.0.0" "platforms;android-34" || true
          godot --headless -e --quit || true
          for S in ~/.config/godot/editor_settings-*.tres; do
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> $S
            echo "export/android/java_sdk_path = \"$JAVA\"" >> $S
            echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $S
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $S
            echo 'export/android/debug_keystore_pass = "android"' >> $S
          done
          godot --headless --import || true
      - name: Diagnostico
        run: |
          echo "DIAG home=$HOME ver=$GODOT_VERSION"
          echo "DIAG plantillas:"; ls ~/.local/share/godot/export_templates/4.3.stable | head -5
          echo "DIAG apks:"; find / -name 'android_*.apk' -not -path '/proc/*' 2>/dev/null
          echo "DIAG ajustes:"; grep -h export/android ~/.config/godot/editor_settings-*.tres
          echo "DIAG keystore:"; ls -la /root/debug.keystore
          echo "DIAG java:"; readlink -f $(which javac)
          echo "DIAG sdk:"; ls /usr/lib/android-sdk /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms
      - name: Exportar
        run: godot --headless --verbose --export-debug "Android" build/android/espacio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: espacio-apk
          path: build/android/espacio.apk
